[project]
name = "elicitagent"
version = "0.1.0"
description = "Reads a folder of materials, finds what an agent still needs to know, and decides per gap whether to read a file, ask, guess and mark it, or wait."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic==2.14.0",
    "pypdf==7.1.1",
]

[project.scripts]
elicitagent = "elicitagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elicitagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
